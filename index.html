<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="小組分享用的倒數計時器，可離線使用。">
  <meta name="theme-color" content="#0f172a">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS home-screen web app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="分享計時">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">

  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <title>小組分享計時</title>
</head>
<body>
  <div class="app" id="app" data-mode="idle" data-panel="closed">

    <!-- ===== Top bar: group logo (top-left) + 名單／座位／設定 panel toggle (top-right) ===== -->
    <header class="topbar">
      <img class="logo" src="./icons/logo.png" alt="心成" width="400" height="120" decoding="async">
      <button type="button" class="btn panel-toggle" id="panelToggle"
              aria-expanded="false" aria-controls="sidePanel">
        <span class="panel-toggle-label" id="panelToggleLabel"><span aria-hidden="true">☰</span> 名單／座位／設定</span>
        <span class="panel-toggle-progress" id="toggleProgress">已分享 0/0</span>
      </button>
    </header>

    <!-- ===== Clock panel (Time Timer–style dial) ===== -->
    <section class="clock-panel" id="clockPanel" aria-label="計時器">
      <div class="dial" id="dial">
        <div class="dial-pie" id="dialPie" aria-hidden="true"></div>
        <div class="dial-tick" aria-hidden="true"></div>
        <div class="dial-center">
          <div class="dial-name" id="speakerName">點選名字開始</div>
          <div class="clock" id="clock" role="timer" aria-live="off" aria-atomic="true">01:00</div>
          <div class="status" id="status">準備</div>
          <!-- 暫停／繼續 + 結束 live inside the dial (shown only while a timer is active) -->
          <div class="dial-controls" id="dialControls">
            <button type="button" class="btn btn-dial" id="pauseBtn" disabled>
              <span class="btn-icon" aria-hidden="true" id="pauseIcon">❚❚</span>
              <span id="pauseText">暫停</span>
            </button>
            <button type="button" class="btn btn-dial btn-end" id="endBtn" disabled>
              <span class="btn-icon" aria-hidden="true">■</span>
              <span>結束</span>
            </button>
          </div>
        </div>
        <div class="paused-badge" id="pausedBadge" hidden>❚❚ 已暫停</div>
      </div>

    </section>

    <!-- ===== Seating chart (built by app.js): one card per person on their side.
         v11: 前 top (前1 left) · 右 right (右1 top) · 後 bottom (後1 left) · 左 left (左1 top). ===== -->
    <div class="seats" id="seats" role="group" aria-label="座位表" hidden></div>

    <!-- ===== Settings & names (progress + reset live in the name-list header) ===== -->
    <!-- Collapsed by default; opened with 名單／設定, auto-collapses when a timer starts -->
    <section class="side" id="sidePanel" aria-label="設定與名單" hidden>
      <!-- Hidden while someone is speaking -->
      <div class="card settings-card" id="settingsCard">
        <div class="settings-head">
          <h2 class="card-title settings-title">每人分享時間</h2>
          <button type="button" class="btn btn-secondary btn-small" id="testBellBtn" title="試音量大小：依實際順序與音量播放所有提示音——「剩下 20 秒」語音、叮咚、「時間到」語音。iPhone 請確認音量已開啟。" aria-label="試音量大小（依序播放「剩下 20 秒」、叮咚、「時間到」）">🔔 試音量大小</button>
        </div>
        <!-- Clock-style stepper: minutes ±1 分, seconds ±5 秒 -->
        <div class="stepper" id="durationGroup" role="group" aria-label="調整每人分享時間">
          <div class="stepper-col">
            <button type="button" class="btn btn-step" id="minPlusBtn" data-step="60" aria-label="增加 1 分鐘">＋</button>
            <div class="stepper-digit" id="durationMin" aria-hidden="true">1</div>
            <button type="button" class="btn btn-step" id="minMinusBtn" data-step="-60" aria-label="減少 1 分鐘">−</button>
          </div>
          <div class="stepper-colon" aria-hidden="true">:</div>
          <div class="stepper-col">
            <button type="button" class="btn btn-step" id="secPlusBtn" data-step="5" aria-label="增加 5 秒">＋</button>
            <div class="stepper-digit" id="durationSec" aria-hidden="true">00</div>
            <button type="button" class="btn btn-step" id="secMinusBtn" data-step="-5" aria-label="減少 5 秒">−</button>
          </div>
          <div class="visually-hidden" id="durationPreview" aria-live="polite" aria-atomic="true">1 分 0 秒</div>
        </div>
        <div class="presets" id="presets" role="group" aria-label="快速選擇時間">
          <button type="button" class="btn btn-chip" data-preset="60">1分</button>
          <button type="button" class="btn btn-chip" data-preset="90">1分30秒</button>
          <button type="button" class="btn btn-chip" data-preset="120">2分</button>
          <button type="button" class="btn btn-chip" data-preset="150">2分30秒</button>
          <button type="button" class="btn btn-chip" data-preset="180">3分</button>
          <button type="button" class="btn btn-chip" data-preset="300">5分</button>
        </div>
      </div>

      <div class="card list-card">
        <!-- 編輯名單 header (replaces the normal header while editing) -->
        <div class="edit-head" id="editHead" hidden>
          <h2 class="card-title edit-title">編輯名單（排座位）</h2>
          <button type="button" class="btn btn-primary btn-done" id="doneBtn">✓ 完成</button>
        </div>
        <div class="card-head" id="listHead">
          <h2 class="card-title">分享名單</h2>
          <button type="button" class="btn btn-switch" id="seatsToggle" role="switch" aria-checked="true">
            <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
            <span>座位圖</span>
          </button>
          <div class="progress" id="progress" aria-live="polite">已分享 0/0</div>
        </div>
        <div class="list-actions" id="listActions">
          <button type="button" class="btn btn-secondary btn-small" id="editBtn" aria-pressed="false">✎ 編輯名單</button>
          <button type="button" class="btn btn-secondary btn-small" id="resetBtn" title="只把已分享狀態清掉並停止計時，名單保留" aria-label="全部重設分享狀態（名單保留）">↺ 全部重設</button>
        </div>
        <p class="hint" id="listHint">點名字開始計時；點灰色名字可恢復為未分享。</p>

        <ol class="people" id="people"></ol>
        <p class="empty" id="emptyMsg" hidden>名單是空的，請按「編輯名單」新增成員。</p>

        <form class="add-form" id="addForm" hidden autocomplete="off">
          <label class="visually-hidden" for="addInput">新增成員姓名</label>
          <input type="text" id="addInput" class="text-input" placeholder="輸入姓名" maxlength="30" enterkeyhint="done">
          <button type="submit" class="btn btn-primary">＋ 新增</button>
        </form>
        <!-- 編輯名單 only: clears ALL names (asks 是／否 in a dialog first) -->
        <div class="edit-foot" id="editFoot" hidden>
          <button type="button" class="btn btn-secondary btn-clear" id="clearMembersBtn">成員全部重設</button>
        </div>
      </div>
    </section>
  </div>

  <!-- 成員全部重設 confirmation (not window.confirm): 是 clears everyone, 否 / Esc cancels -->
  <div class="modal" id="clearDialog" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="clearDialogTitle">
      <h2 class="modal-title" id="clearDialogTitle">確定清除全部成員？</h2>
      <div class="modal-actions">
        <button type="button" class="btn btn-modal btn-yes" id="clearYes">是</button>
        <button type="button" class="btn btn-modal btn-no" id="clearNo">否</button>
      </div>
    </div>
  </div>

  <!-- 編輯名單: side picker opened from a row's seat-label button (「前1 ▾」).
       Anchored under / over that row on wide screens; a bottom sheet on phones. -->
  <div class="picker-backdrop" id="sidePickerBackdrop" hidden></div>
  <div class="side-picker" id="sidePicker" role="dialog" aria-labelledby="sidePickerTitle" hidden>
    <h2 class="side-picker-title" id="sidePickerTitle">坐哪一邊？</h2>
    <div class="side-picker-sides" id="sidePickerSides" role="group" aria-label="前、右、後、左">
      <button type="button" class="btn btn-pick-side" data-side="前">前</button>
      <button type="button" class="btn btn-pick-side" data-side="右">右</button>
      <button type="button" class="btn btn-pick-side" data-side="後">後</button>
      <button type="button" class="btn btn-pick-side" data-side="左">左</button>
    </div>
    <button type="button" class="btn btn-secondary btn-pick-cancel" id="sidePickerCancel">取消</button>
  </div>

  <!-- Screen-reader announcements (time's up, overtime, etc.) -->
  <div class="visually-hidden" id="announcer" aria-live="assertive" aria-atomic="true"></div>

  <script src="./app.js" defer></script>
</body>
</html>
